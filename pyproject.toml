[project]
name = "pit-haf"
version = "0.1.0"
description = "Recovered PiT-HAF thesis project"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "vnstock==4.0.7",
  "streamlit",
  "yfinance",
  "plotly",
  "pydantic",
  "ollama",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pit_haf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
